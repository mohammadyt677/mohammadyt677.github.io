name: Build and Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          ACB15A: ${{ secrets.ACB15A }}
          BFB683: ${{ secrets.BFB683 }}
        run: |
          python3 -c "
          import os, pathlib, sys
          k1 = os.environ.get('ACB15A', '')
          k2 = os.environ.get('BFB683', '')
          idx = pathlib.Path('index.html')
          txt = idx.read_text(encoding='utf-8')
          out = txt.replace('<!-- 0ab7520b02c4c5dc6b8a3f8b13bafa21b94f47 -->', k1) if k1 else txt
          out = out.replace('<!-- e48353e1cc2b2a2f53c5dc37e78759639943fff5ae8564 -->', k2) if k2 else out
          if out == txt and (k1 or k2):
              sys.exit(1)
          if out != txt:
              idx.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
